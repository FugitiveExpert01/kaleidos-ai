<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Latentiq Studio to discuss cinematic AI production, ComfyUI pipeline architecture, and custom AI filmmaking workflows.">
    <meta name="keywords" content="cinematic AI, ComfyUI, LoRA training, AI film studio, AI filmmaker, AI artist, AI cinematographer">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Latentiq Studio">
    <meta property="og:title" content="Contact Latentiq Studio">
    <meta property="og:description" content="Contact Latentiq Studio to discuss cinematic AI production, ComfyUI pipeline architecture, and custom AI filmmaking workflows.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Contact Latentiq Studio">
    <meta name="twitter:description" content="Contact Latentiq Studio to discuss cinematic AI production, ComfyUI pipeline architecture, and custom AI filmmaking workflows.">
    <title>Contact Latentiq Studio</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
    <link rel="dns-prefetch" href="https://unpkg.com">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="antialiased relative selection:bg-brand selection:text-white bg-[#08080a] can-scroll">
    <div class="bg-mesh"></div>
    <div class="dot-grid-overlay"></div>

    <header class="relative z-30 px-6 md:px-24 py-10 flex items-center justify-between">
        <a href="index.html" class="text-white font-black text-xl tracking-tighter">Latentiq Studio</a>
        <a href="index.html" class="text-brand font-mono text-sm uppercase tracking-[0.3em]">Back to Home</a>
    </header>

    <main class="relative z-30 px-6 md:px-24 mx-auto max-w-4xl py-20">
        <section class="glass-panel border border-white/10 bg-[#08080a]/90 p-10 rounded-[2rem] shadow-2xl">
            <p class="text-brand font-mono text-xs tracking-[0.5em] uppercase mb-6">Contact</p>
            <h1 class="text-5xl md:text-6xl font-black tracking-tighter mb-8 text-white">Start a Project with Latentiq</h1>
            <p class="text-white/60 text-lg leading-relaxed mb-10">Send us your brief or project idea and we’ll get back to you with a tailored AI filmmaking and production strategy.</p>
            <form action="https://formspree.io/f/your-form-id" method="POST" class="space-y-6">
                <div>
                    <label for="name" class="block text-sm font-mono text-white/60 mb-2">Name</label>
                    <input type="text" id="name" name="name" required class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl text-white placeholder-white/40 focus:border-brand focus:outline-none">
                </div>
                <div>
                    <label for="email" class="block text-sm font-mono text-white/60 mb-2">Email</label>
                    <input type="email" id="email" name="email" required class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl text-white placeholder-white/40 focus:border-brand focus:outline-none">
                </div>
                <div>
                    <label for="company" class="block text-sm font-mono text-white/60 mb-2">Company / Studio</label>
                    <input type="text" id="company" name="company" class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl text-white placeholder-white/40 focus:border-brand focus:outline-none">
                </div>
                <div>
                    <label for="message" class="block text-sm font-mono text-white/60 mb-2">What would you like to build?</label>
                    <textarea id="message" name="message" rows="6" required class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl text-white placeholder-white/40 focus:border-brand focus:outline-none resize-none"></textarea>
                </div>
                <button type="submit" class="inline-flex items-center justify-center px-10 py-4 bg-brand text-white font-bold rounded-full hover:bg-brand/80 transition-colors">Send Inquiry</button>
            </form>
        </section>
    </main>
</body>
</html>
